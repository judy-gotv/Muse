# Author: Passwd Word
# Muse-Api -> GHCR (amd64 + arm64), 推 main / 打 tag 时构建. 源码就是本仓库根目录.
# 规则 (ghcr_container_delivery):
# - 同一 mutable tag 不并行构建: 新推送取消旧的未完成构建, 只留最新一次 (配合自动递增版本, 旧版本构建直接作废).
# - 绿≠可用: 构建后按 immutable digest 拉镜像跑起来, /healthz + 远程导入组件双断言.
# - 二进制 < 1MB 直接失败, 不出空镜像.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-build
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/muse-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test by digest (拉 immutable digest, 跑起来再验)
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          echo "image digest: $DIGEST"
          docker pull "${{ env.IMAGE }}@$DIGEST"
          docker run -d --name muse-api-smoke --shm-size=2g -p 18611:18611 \
            -e M2RS_API_KEY=smoke-test-only-key "${{ env.IMAGE }}@$DIGEST"
          trap 'docker logs muse-api-smoke || true; docker rm -f muse-api-smoke >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:18611/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" -eq 1 ] || { echo "容器 60 秒内 /healthz 未通"; exit 1; }
          echo "healthz: $(curl -fsS http://127.0.0.1:18611/healthz)"
          echo "version: $(curl -fsS http://127.0.0.1:18611/admin/update/check)"
          RI="$(curl -fsS http://127.0.0.1:18611/admin/remote-import)"
          echo "remote-import: $RI"
          echo "$RI" | grep -q '"key":"browser".*"present":true' || echo "$RI" | grep -q '"present":true' \
            || { echo "远程导入组件未就绪 (Chromium/Xvfb 缺失)"; exit 1; }
          echo "SMOKE OK: digest $DIGEST"
