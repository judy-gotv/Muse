# Author: Passwd Word
# Mapi — Muse (muse.ai) 逆向封装为 OpenAI 兼容接口 (Rust 重写版)
# 1:1 目标: 演示站 Mapi 0.2.29 (端口 18611)。功能规约见 Python 原版 muse2api
# (judy-gotv/muse_api, v1.6.11) 与演示站控制台; 远程导入模块见 src/remote_import.rs。
[package]
name = "muse2api-rs"
version = "0.0.1"
edition = "2021"
description = "Mapi: Muse (muse.ai) reverse-proxied as an OpenAI-compatible API"
license = "MIT"

[[bin]]
name = "mapi"
path = "src/main.rs"

[lib]
name = "muse2api_rs"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "query", "form", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.26"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
base64 = "0.22"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
opt-level = 2
